[package]
name = "geoview"
version = "0.3.1"
edition = "2021"
description = "Drop-in replacement for snowie2000/geoview"
license = "MIT"

[[bin]]
name = "geoview"
path = "src/main.rs"

[dependencies]
flate2 = "1.0"
io-uring = "0.7"
libc = "0.2"
regex = "1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
